name: Daily Bellhaven sync

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py
        env:
          CRM_API_TOKEN: ${{ secrets.CRM_API_TOKEN }}
          DB_PATH: data/sync.db
      - name: Persist the decision store
        run: |
          git config user.name "bellhaven-sync"
          git config user.email "bellhaven-sync@users.noreply.github.com"
          git add data/sync.db data/locations.json
          git commit -m "Daily sync run" || echo "No changes"
          git push
